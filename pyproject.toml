[project]
name = "tel-c3-909"
version = "1.0.0"
description = "MonitoringAlertFirstTriageAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
#
# The three packages below ARE public-PyPI and are imported directly by this
# template's own source (readonly_gateway.py / runbook_service.py /
# diagnostic_tools.py) rather than only transitively through the framework —
# IMP-0002 requires an exact pin for any dependency the template code imports.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "httpx==0.28.1",
    "PyYAML==6.0.1",
    "langchain-core==1.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff.lint.per-file-ignores]
# 上流 scaffold master 由来の既知違反のみを該当ファイル限定で抑止する。
# 配布元由来の PB テストなので**本体を書き換えず** byte-identity を維持する
# （scaffold 再同期で差分を出さないため）。正本自身にも同じ F541 が存在する。
# conftest は sys.path へ repo root を挿してから src/tests を import する必要があるため
# module-level import が先頭に来ない（E402）。構造上の要請なので当該ファイル限定で抑止する。
"tests/conftest.py" = ["E402"]
"tests/proof_of_boundary/test_import_isolation.py" = ["F541"]
"tests/proof_of_boundary/test_state_safety.py" = ["F541"]
